name: Valider pull request
on:
  pull_request:
    branches-ignore:
      - slette_V1
    types: [opened, synchronize, reopened, edited]
    paths-ignore:
      - '**.md'
      - '**.MD'
      - '.gitignore'
      - 'CODEOWNERS'

concurrency:
  # Samme gruppe brukes av cancel-merged-pr.yml etter merge.
  group: valider-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Bygg og test kode
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Hente kode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sette opp pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.15.1
      - name: Sette opp Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          cache: pnpm
      - name: Sette opp npm-auth mot GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
      - name: Installere dependencies
        run: pnpm install --frozen-lockfile
      - name: Sjekk - TypeScript, lint og formatering
        run: pnpm verify
      - name: Tester
        run: pnpm test --maxWorkers=2
      - name: Bygge
        run: pnpm build
        # Lager en selvstendig server-deploy med kun serverens prod-dependencies (samme som i build-and-deploy).
        # node-linker=hoisted gir en flat node_modules uten symlenker, som kopieres rent inn i Docker.
      - name: Lag server-deploy
        run: |
          rm -rf ./deploy
          pnpm --filter=@k9-los-web/server --config.node-linker=hoisted deploy --prod ./deploy
          test -f ./deploy/server.js || { echo "::error ::deploy/server.js mangler"; exit 1; }
          test "$(find ./deploy -type l | wc -l)" -eq 0 || { echo "::error ::deploy inneholder symlenker"; exit 1; }

  sif-code-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: navikt/sif-gha-workflows/.github/actions/sif-code-scan@97a944ba12c0db588a29cfeed8a7dcb22e087d3f # v1.0.1

  los-tester:
    name: LOS nettlesertester
    needs: build-and-test
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/los-e2e.yml
    with:
      api_ref: master
      web_ref: ${{ github.sha }}
    secrets:
      READER_TOKEN: ${{ secrets.READER_TOKEN }}
