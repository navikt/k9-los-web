name: Nettlesertester frontend og backend

on:
  workflow_dispatch:
    inputs:
      api_ref:
        description: 'Branch eller full commit-SHA i k9-los-api'
        type: string
        default: master
      web_ref:
        description: 'Branch eller full commit-SHA i k9-los-web (tomt felt bruker commiten for kjøringen)'
        type: string
  workflow_call:
    inputs:
      api_ref:
        type: string
        required: true
      web_ref:
        type: string
        required: true
    secrets:
      READER_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  playwright:
    if: >-
      (github.repository == 'navikt/k9-los-web' || github.repository == 'navikt/k9-los-api') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    concurrency:
      group: los-e2e-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Velg web- og API-versjon
        id: versions
        shell: bash
        env:
          API_REF: ${{ inputs.api_ref || 'master' }}
          WEB_REF: ${{ inputs.web_ref || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            case "$GITHUB_REPOSITORY" in
              navikt/k9-los-web) peer=k9-los-api ;;
              navikt/k9-los-api) peer=k9-los-web ;;
            esac
            # shellcheck disable=SC2016
            overrides=$(jq -c --arg prefix "$peer:" '
              (.pull_request.body // "") | split("\n")
              | map(gsub("^[[:space:]]+|[[:space:]]+$"; "")
                    | select(startswith($prefix)) | ltrimstr($prefix)
                    | gsub("^[[:space:]]+|[[:space:]]+$"; ""))
            ' "$GITHUB_EVENT_PATH")
            case $(jq 'length' <<< "$overrides") in
              0) ;;
              1)
                branch=$(jq -r '.[0]' <<< "$overrides")
                case "$peer" in
                  k9-los-api) API_REF="refs/heads/$branch" ;;
                  k9-los-web) WEB_REF="refs/heads/$branch" ;;
                esac
                ;;
              *) echo "::error::Bruk bare én linje med $peer: <branch> i PR-beskrivelsen."; exit 1 ;;
            esac
          fi

          resolve() {
            local repo=$1 ref=$2 branch encoded sha
            if [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
              printf '%s\n' "$ref"
              return
            fi
            branch=${ref#refs/heads/}
            if [[ ! "$branch" =~ ^[a-zA-Z0-9._/-]+$ ]] || ! git check-ref-format "refs/heads/$branch"; then
              echo "::error::Bruk et gyldig branchnavn i navikt/$repo." >&2
              return 1
            fi
            encoded=$(printf '%s' "$branch" | jq -sRr @uri)
            if ! sha=$(gh api "repos/navikt/$repo/git/ref/heads/$encoded" --jq '.object.sha') || [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Kunne ikke slå opp branchen $branch i navikt/$repo." >&2
              return 1
            fi
            printf '%s\n' "$sha"
          }

          web_sha=$(resolve k9-los-web "$WEB_REF")
          api_sha=$(resolve k9-los-api "$API_REF")
          printf 'web_sha=%s\napi_sha=%s\n' "$web_sha" "$api_sha" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REPOSITORY" == navikt/k9-los-web && "$WEB_REF" == "$GITHUB_SHA" ]]; then
            WEB_REF=$GITHUB_REF
          elif [[ "$GITHUB_REPOSITORY" == navikt/k9-los-api && "$API_REF" == "$GITHUB_SHA" ]]; then
            API_REF=$GITHUB_REF
          fi
          # shellcheck disable=SC2016
          printf '### LOS nettlesertester\n\n- k9-los-web: `%s` → `%s`\n- k9-los-api: `%s` → `%s`\n' \
            "${WEB_REF#refs/heads/}" "$web_sha" "${API_REF#refs/heads/}" "$api_sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Hent frontend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: navikt/k9-los-web
          ref: ${{ steps.versions.outputs.web_sha }}
          path: web
          persist-credentials: false
      - name: Hent backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: navikt/k9-los-api
          ref: ${{ steps.versions.outputs.api_sha }}
          path: api
          persist-credentials: false
      - name: Kontroller E2E-støtte i backend
        run: |
          for file in .github/e2e/compose.yml scripts/start-dev.sh; do
            if [[ ! -f "api/$file" ]]; then
              echo "::error::Valgt API-commit mangler $file. Velg en branch med E2E-støtte."
              exit 1
            fi
          done
      - name: Sett opp Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: api/pom.xml
      - name: Sett opp pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - name: Sett opp Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Installer frontend og Chromium
        working-directory: web
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
        run: |
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" >> ~/.npmrc
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Klargjør isolerte støttetjenester
        id: support
        run: docker compose -f api/.github/e2e/compose.yml up -d --wait --wait-timeout 180
      - name: Bygg backend
        working-directory: api
        env:
          MAVEN_PASSWORD: ${{ secrets.READER_TOKEN }}
        run: |
          mvn --batch-mode --settings ../web/.github/maven-settings.xml test-compile dependency:build-classpath \
            -DincludeScope=test -Dmdep.outputFile=target/dev-classpath.txt
      - name: Start backend
        working-directory: api
        shell: bash
        run: |
          bash scripts/start-dev.sh --no-build > "$RUNNER_TEMP/los-e2e-backend.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/los-e2e-backend.pid"
          for ((attempt = 0; attempt < 90; attempt++)); do
            if curl --silent --fail --max-time 2 http://localhost:8020/api/testdata/ready > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/los-e2e-backend.pid")" 2>/dev/null; then
              echo '::error::Backend stoppet under oppstart. Se backend-loggen.'
              exit 1
            fi
            sleep 2
          done
          echo '::error::Backend ble ikke klar innen fristen.'
          exit 1
      - name: Kjør Playwright
        working-directory: web
        run: pnpm test:e2e
      - name: Samle tjenestelogger
        if: always() && steps.support.outcome != 'skipped'
        run: docker compose -f api/.github/e2e/compose.yml logs --no-color > "$RUNNER_TEMP/los-e2e-services.log"
      - name: Last opp rapport og logger
        if: always() && steps.support.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: los-e2e
          retention-days: 7
          path: |
            web/playwright-report/
            web/test-results/
            ${{ runner.temp }}/los-e2e-backend.log
            ${{ runner.temp }}/los-e2e-services.log
      - name: Stopp støttetjenester
        if: always() && steps.support.outcome != 'skipped'
        run: |
          if [[ -f "$RUNNER_TEMP/los-e2e-backend.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/los-e2e-backend.pid")" 2>/dev/null || true
          fi
          docker compose -f api/.github/e2e/compose.yml down --volumes
