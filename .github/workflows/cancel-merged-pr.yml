name: Kanseller validering av merget pull request

on:
  pull_request:
    types: [closed]

jobs:
  cancel-validation:
    if: github.event.pull_request.merged
    concurrency:
      # Samme gruppe som i valid-pull-request.yml.
      group: valider-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: 'true'
