name: LOS nettlesertester

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      api_ref:
        description: 'Commit-SHA i k9-los-api med testdatastøtte'
        type: string
        required: true
  workflow_call:
    inputs:
      api_ref:
        type: string
        required: true
      web_ref:
        type: string
        required: true
    secrets:
      READER_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  playwright:
    name: Frontend og ekte LOS-backend
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      CI: 'true'
      API_REF: ${{ inputs.api_ref || vars.LOS_E2E_API_REF }}
    steps:
      - name: Kontroller backend-versjon
        shell: bash
        run: |
          if [[ ! "$API_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Sett LOS_E2E_API_REF til commit-SHA i k9-los-api med testdatastøtte, eller oppgi api_ref.'
            exit 1
          fi
      - name: Hent frontend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: navikt/k9-los-web
          ref: ${{ inputs.web_ref || github.sha }}
          path: web
          persist-credentials: false
      - name: Hent backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: navikt/k9-los-api
          ref: ${{ env.API_REF }}
          path: api
          persist-credentials: false
          token: ${{ secrets.READER_TOKEN }}
      - name: Registrer versjoner
        run: |
          git -C web rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git -C api rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - name: Sett opp Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: api/pom.xml
      - name: Sett opp pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - name: Sett opp Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Installer frontend og Chromium
        working-directory: web
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
        run: |
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" >> ~/.npmrc
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Autentiser mot GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.READER_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Klargjør isolerte støttetjenester
        id: support
        shell: bash
        run: |
          export E2E_CERT_DIR="$RUNNER_TEMP/los-e2e-certificates"
          export E2E_DB_PASSWORD="$(openssl rand -hex 16)"
          export E2E_STORE_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$E2E_DB_PASSWORD"
          echo "::add-mask::$E2E_STORE_PASSWORD"
          echo "E2E_DB_PASSWORD=$E2E_DB_PASSWORD" >> "$GITHUB_ENV"
          echo "E2E_STORE_PASSWORD=$E2E_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "E2E_CERT_DIR=$E2E_CERT_DIR" >> "$GITHUB_ENV"
          bash api/.github/e2e/create-keystores.sh
          docker compose -f api/.github/e2e/compose.yml up -d --wait --wait-timeout 180
      - name: Bygg backend
        working-directory: api
        env:
          MAVEN_PASSWORD: ${{ secrets.READER_TOKEN }}
        run: |
          mvn --batch-mode --settings ../web/.github/maven-settings.xml test-compile dependency:build-classpath \
            -DincludeScope=test -Dmdep.outputFile=target/dev-classpath.txt
      - name: Start backend
        shell: bash
        run: |
          bash api/.github/e2e/start-backend.sh > "$RUNNER_TEMP/los-e2e-backend.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/los-e2e-backend.pid"
          for attempt in {1..90}; do
            if curl --silent --fail --max-time 2 http://localhost:8020/api/testdata/ready > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/los-e2e-backend.pid")" 2>/dev/null; then
              echo '::error::Backend stoppet under oppstart. Se backend-loggen.'
              exit 1
            fi
            sleep 2
          done
          echo '::error::Backend ble ikke klar innen fristen.'
          exit 1
      - name: Kjør Playwright
        working-directory: web
        run: pnpm test:e2e
      - name: Samle tjenestelogger
        if: always() && steps.support.outcome != 'skipped'
        run: docker compose -f api/.github/e2e/compose.yml logs --no-color > "$RUNNER_TEMP/los-e2e-services.log"
      - name: Last opp rapport og logger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: los-e2e
          retention-days: 7
          path: |
            web/playwright-report/
            web/test-results/
            ${{ runner.temp }}/los-e2e-backend.log
            ${{ runner.temp }}/los-e2e-services.log
      - name: Stopp støttetjenester
        if: always() && steps.support.outcome != 'skipped'
        run: |
          if [[ -f "$RUNNER_TEMP/los-e2e-backend.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/los-e2e-backend.pid")" 2>/dev/null || true
          fi
          docker compose -f api/.github/e2e/compose.yml down --volumes
